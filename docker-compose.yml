services:
  dreimetadaten-provider:
    build: .
    container_name: dreimetadaten-provider
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Berlin
      # Optional: Schlüssel, den Audiobookshelf als "Authorization Header Value" mitschicken muss
      # - API_KEY=geheim
    restart: unless-stopped
